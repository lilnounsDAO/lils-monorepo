# http-level config for the public rounds routes (/etc/nginx/conf.d/rounds.conf).
# Reads share a 20s cache, so a busy round page costs the service ~1 request/20s
# per query. Writes are never cached and get their own, tighter rate limit.
proxy_cache_path /var/cache/nginx/rounds levels=1:2 keys_zone=rounds:10m max_size=100m inactive=10m use_temp_path=off;
limit_req_zone $binary_remote_addr zone=rounds_rl:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=rounds_write_rl:10m rate=1r/s;
# Imported images are content-addressed and never change, so they get their own
# long-lived cache. A round page asks for a lot of them at once, so the limit is
# far looser than the one on the API itself.
proxy_cache_path /var/cache/nginx/rounds_images levels=1:2 keys_zone=rounds_images:10m max_size=1g inactive=90d use_temp_path=off;
limit_req_zone $binary_remote_addr zone=rounds_image_rl:10m rate=40r/s;

# Only our sites may read it from a browser; the data is public either way.
map $http_origin $rounds_cors_origin {
    default "";
    "https://lilnouns.wtf" $http_origin;
    "https://www.lilnouns.wtf" $http_origin;
    "~^https://[a-z0-9-]+\.lilnouns\.wtf$" $http_origin;
    "~^https://[a-z0-9-]+--[a-z0-9-]+\.netlify\.app$" $http_origin;
    "http://localhost:3000" $http_origin;
}

# GET is cacheable; everything else must reach the service.
map $request_method $rounds_no_cache {
    default 1;
    GET 0;
    HEAD 0;
}
