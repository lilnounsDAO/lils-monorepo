# Goes inside the db.lilnouns.wtf server block, before `location /api/`.
# `^~` wins over the /api/ prefix that serves db-api. The prefix is stripped, so
# the public URLs are /api/funding/rounds, /api/funding/house and
# /api/funding/proposals/<id>, and VITE_ROUNDS_API_URL is the prefix itself.
location ^~ /api/funding/ {
    # Writes carry their own signature, so the service authorizes them; nginx
    # only keeps a flood off it.
    limit_req zone=rounds_rl burst=20 nodelay;
    limit_req zone=rounds_write_rl burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 256k;

    proxy_pass http://127.0.0.1:3040/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_cache rounds;
    proxy_cache_key $request_method$request_uri;
    proxy_cache_valid 200 20s;
    proxy_cache_lock on;
    proxy_no_cache $rounds_no_cache;
    proxy_cache_bypass $rounds_no_cache;
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503;
    proxy_cache_background_update on;

    proxy_hide_header Access-Control-Allow-Origin;
    add_header Access-Control-Allow-Origin $rounds_cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, OPTIONS" always;
    add_header Access-Control-Allow-Headers "content-type" always;
    add_header Vary Origin always;
    add_header X-Cache-Status $upstream_cache_status always;
    add_header X-Content-Type-Options "nosniff" always;
}
