# http-level config for the public digest route (/etc/nginx/conf.d/digest.conf).
# Visitors share a 15s cache, so traffic spikes cost the indexer ~1 request/15s per query.
proxy_cache_path /var/cache/nginx/digest levels=1:2 keys_zone=digest:10m max_size=100m inactive=10m use_temp_path=off;
limit_req_zone $binary_remote_addr zone=digest_rl:10m rate=5r/s;

# Only our sites may read it from a browser (data is public onchain either way).
map $http_origin $digest_cors_origin {
    default "";
    "https://lilnouns.wtf" $http_origin;
    "https://www.lilnouns.wtf" $http_origin;
    "~^https://[a-z0-9-]+\.lilnouns\.wtf$" $http_origin;
    "~^https://[a-z0-9-]+--[a-z0-9-]+\.netlify\.app$" $http_origin;
    "http://localhost:3000" $http_origin;
}
