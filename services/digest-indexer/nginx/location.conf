# Goes inside the db.lilnouns.wtf server block, before `location /api/`.
# Exact match wins over the /api/ prefix that serves db-api.
location = /api/digest {
    limit_except GET { deny all; }
    limit_req zone=digest_rl burst=20 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:3020/digest;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_cache digest;
    proxy_cache_key $request_uri;
    proxy_cache_valid 200 15s;
    proxy_cache_lock on;
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503;
    proxy_cache_background_update on;

    proxy_hide_header Access-Control-Allow-Origin;
    add_header Access-Control-Allow-Origin $digest_cors_origin always;
    add_header Vary Origin always;
    add_header X-Cache-Status $upstream_cache_status always;
    add_header X-Content-Type-Options "nosniff" always;
}
