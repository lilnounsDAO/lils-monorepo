# Goes inside the db.lilnouns.wtf server block, before `location /api/`.

location = /api/ipfs/upload {
    limit_except POST OPTIONS { deny all; }
    limit_req zone=ipfs_upload_rl burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 6m;

    proxy_pass http://127.0.0.1:3030/upload;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_request_buffering on;
}

# Read-only gateway. Kubo runs with Gateway.NoFetch, so it serves only what this
# node pinned (images that passed the upload checks), never arbitrary IPFS content.
location /ipfs/ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;

    proxy_cache ipfs;
    proxy_cache_valid 200 30d;
    proxy_cache_use_stale error timeout updating;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Cache-Control;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
}
